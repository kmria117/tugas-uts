<!DOCTYPE HTML>
<html>
<head>
  <title>Tambah Siswa - SMAN 13 Sinjai</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- HEADER -->
  <header>Sistem Informasi Sekolah</header>

  <div class="main-container">

    <!-- SIDEBAR -->
    <aside>
      <ul class="menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="tabel.html">Data Siswa</a></li>
        <li><a href="form.html">Tambah Siswa</a></li>
        <li><a href="login.html">Keluar</a></li>
      </ul>
    </aside>

    <!-- MAIN -->
    <section class="main">
      <h2 class="judul">
        <i class="bi bi-person-plus me-2"></i>Tambah Siswa
      </h2>

      <div class="bs-form-card">
        <form>

          <!-- Foto -->
          <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fw-semibold">Foto</label>
            <div class="col-sm-8">
              <input type="file" class="form-control">
            </div>
          </div>

          <!-- NIS -->
          <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fw-semibold">NIS</label>
            <div class="col-sm-8">
              <input type="text" class="form-control" placeholder="Masukkan NIS">
            </div>
          </div>

          <!-- Nama -->
          <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fw-semibold">Nama</label>
            <div class="col-sm-8">
              <input type="text" class="form-control" placeholder="Nama lengkap">
            </div>
          </div>

          <!-- Jenis Kelamin -->
          <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fw-semibold">Jenis Kelamin</label>
            <div class="col-sm-8 d-flex gap-4 pt-2">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="jk" value="L">
                <label class="form-check-label">Laki-laki</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="jk" value="P">
                <label class="form-check-label">Perempuan</label>
              </div>
            </div>
          </div>

          <!-- Tanggal Lahir -->
          <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fw-semibold">Tanggal Lahir</label>
            <div class="col-sm-8">
              <input type="date" class="form-control">
            </div>
          </div>

          <!-- Kelas -->
          <div class="row mb-3 align-items-center">
            <label class="col-sm-4 col-form-label fw-semibold">Kelas</label>
            <div class="col-sm-8">
              <select class="form-select">
                <option>X</option>
                <option>XI</option>
                <option>XII</option>
              </select>
            </div>
          </div>

          <!-- Jurusan -->
          <div class="row mb-4 align-items-center">
            <label class="col-sm-4 col-form-label fw-semibold">Jurusan</label>
            <div class="col-sm-8">
              <select class="form-select">
                <option>IPA</option>
                <option>IPS</option>
            
              </select>
            </div>
          </div>

          <!-- Tombol -->
          <div class="row">
            <div class="col-sm-8 offset-sm-4 d-flex gap-2">
              <button type="submit" class="btn btn-simpan">
                <i class="bi bi-save me-1"></i>Simpan
              </button>
              <button type="reset" class="btn btn-batal">
                <i class="bi bi-x-circle me-1"></i>Batal
              </button>
            </div>
          </div>

        </form>
      </div>
    </section>
  </div>

  <footer>© 2026 SMAN 13 Sinjai</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
