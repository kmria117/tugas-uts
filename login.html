<!DOCTYPE html>
<html>
<head>
  <title>Login - SMAN 13 Sinjai</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

  <div class="login-card text-center">

    <!-- LOGO -->
    <img src="resource/logo.jpg" class="logo-img mb-3">

    <!-- NAMA SEKOLAH -->
    <div class="brand">SMAN <span>13 Sinjai</span></div>
    <div class="subtitle">Login Sistem Informasi Sekolah</div>

    <form>
      <div class="mb-3 text-start">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" placeholder="Masukkan username">
        </div>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" placeholder="Masukkan password">
        </div>
      </div>

      <a href="dashboard.html" class="btn-login d-block text-center">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </a>
    </form>

    <div class="footer-text mt-3">
      &copy; 2026 SMAN 13 Sinjai
    </div>

  </div>

</body>
</html>
