<!DOCTYPE HTML>
<html>
<head>
  <title>Dashboard - SMAN 13 Sinjai</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- HEADER -->
  <header>Sistem Informasi Sekolah</header>

  <div class="main-container">

    <!-- SIDEBAR -->
    <aside>
      <ul class="menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="tabel.html">Data Siswa</a></li>
        <li><a href="form.html">Tambah Siswa</a></li>
        <li><a href="login.html">Keluar</a></li>
      </ul>
    </aside>

    <!-- MAIN -->
    <section class="main">

      <h2 class="judul">Dashboard</h2>

      <div class="row mt-4">

        <!-- CARD 1 -->
        <div class="col-md-4 mb-3">
          <div class="card text-center shadow">
            <div class="card-body">
              <i class="bi bi-people-fill fs-1 text-primary"></i>
              <h5 class="mt-2">Data Siswa</h5>
              <p>Kelola data siswa</p>
              <a href="tabel.html" class="btn btn-primary btn-sm">Lihat</a>
            </div>
          </div>
        </div>

        <!-- CARD 2 -->
        <div class="col-md-4 mb-3">
          <div class="card text-center shadow">
            <div class="card-body">
              <i class="bi bi-person-plus-fill fs-1 text-success"></i>
              <h5 class="mt-2">Tambah Siswa</h5>
              <p>Input data siswa baru</p>
              <a href="form.html" class="btn btn-success btn-sm">Tambah</a>
            </div>
          </div>
        </div>

        <!-- CARD 3 -->
        <div class="col-md-4 mb-3">
          <div class="card text-center shadow">
            <div class="card-body">
              <i class="bi bi-box-arrow-right fs-1 text-danger"></i>
              <h5 class="mt-2">Keluar</h5>
              <p>Logout dari sistem</p>
              <a href="login.html" class="btn btn-danger btn-sm">Keluar</a>
            </div>
          </div>
        </div>

      </div>

    </section>
  </div>

  <footer>© 2026 SMAN 13 Sinjai</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
